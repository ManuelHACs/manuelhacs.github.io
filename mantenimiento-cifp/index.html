<style>
/* Layout: taller de mantenimiento — barra fija con resumen, pestañas por área, lista de órdenes agrupada y panel lateral de detalle */
:root{
  --bg:#edf0ec; --surface:#ffffff; --surface-2:#f5f7f4; --fg:#18211d; --muted:#5a6962; --line:#d3dbd6;
  --accent:#1d5c47; --accent-ink:#ffffff; --accent-soft:#dcebe3; --focus:#2f7d62; --shadow:0 10px 30px rgba(20,40,30,.14);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --s-pendiente-bg:#e7ebe8; --s-pendiente-fg:#3c4943;
  --s-cola-bg:#e3e6f7; --s-cola-fg:#353f8f;
  --s-ejecucion-bg:#dcecfa; --s-ejecucion-fg:#14588f;
  --s-espera-bg:#fbefd2; --s-espera-fg:#7f5603;
  --s-externa-bg:#efe3f6; --s-externa-fg:#6a3388;
  --s-problemas-bg:#fbe0dc; --s-problemas-fg:#a1271b;
  --s-ejecutado-bg:#d9efe1; --s-ejecutado-fg:#1c6b3d;
  --s-no_aplica-bg:#eceeed; --s-no_aplica-fg:#7c8782;
  --due-late:#b42d1e; --due-soon:#9a6a00; --due-ok:#2b7a4b;
  --dest-m-bg:#dfe7f3; --dest-m-fg:#2a4a78; --dest-f-bg:#e9efd6; --dest-f-fg:#4c5f12;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --surface-2:#1c2521; --fg:#e4ebe7; --muted:#95a59d; --line:#2b3732;
  --accent:#62c29c; --accent-ink:#08150f; --accent-soft:#1d3a2f; --focus:#7fd6b1; --shadow:0 10px 30px rgba(0,0,0,.5);
  --s-pendiente-bg:#26302c; --s-pendiente-fg:#c3cec8; --s-cola-bg:#252b4d; --s-cola-fg:#b5bdf5; --s-ejecucion-bg:#163650; --s-ejecucion-fg:#9fd0fb;
  --s-espera-bg:#3e3112; --s-espera-fg:#f2cf7a; --s-externa-bg:#36244a; --s-externa-fg:#dcb5f5; --s-problemas-bg:#4a1f1a; --s-problemas-fg:#ffaca1;
  --s-ejecutado-bg:#173a26; --s-ejecutado-fg:#8fe0ac; --s-no_aplica-bg:#232927; --s-no_aplica-fg:#86948d;
  --due-late:#ff8c7d; --due-soon:#f0c35a; --due-ok:#7ad69d; --dest-m-bg:#1f2d44; --dest-m-fg:#a9c4ee; --dest-f-bg:#2c3416; --dest-f-fg:#c9dc8c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --surface-2:#1c2521; --fg:#e4ebe7; --muted:#95a59d; --line:#2b3732;
  --accent:#62c29c; --accent-ink:#08150f; --accent-soft:#1d3a2f; --focus:#7fd6b1; --shadow:0 10px 30px rgba(0,0,0,.5);
  --s-pendiente-bg:#26302c; --s-pendiente-fg:#c3cec8; --s-cola-bg:#252b4d; --s-cola-fg:#b5bdf5; --s-ejecucion-bg:#163650; --s-ejecucion-fg:#9fd0fb;
  --s-espera-bg:#3e3112; --s-espera-fg:#f2cf7a; --s-externa-bg:#36244a; --s-externa-fg:#dcb5f5; --s-problemas-bg:#4a1f1a; --s-problemas-fg:#ffaca1;
  --s-ejecutado-bg:#173a26; --s-ejecutado-fg:#8fe0ac; --s-no_aplica-bg:#232927; --s-no_aplica-fg:#86948d;
  --due-late:#ff8c7d; --due-soon:#f0c35a; --due-ok:#7ad69d; --dest-m-bg:#1f2d44; --dest-m-fg:#a9c4ee; --dest-f-bg:#2c3416; --dest-f-fg:#c9dc8c; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance}
.brand small{color:var(--muted);font-size:.82rem}
.brand small b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:290px;padding:6px;z-index:40}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop b{display:block;font-weight:600}
.menu-pop span{color:var(--muted);font-size:.82rem}
.banner{background:var(--s-espera-bg);color:var(--s-espera-fg);font-size:.88rem;padding-block:8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;padding-block:14px 6px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--k,var(--line))}
.kpi .n{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:500}
.kpi[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.toolbar{display:flex;flex-direction:column;gap:10px;padding-block:8px 6px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:9px 12px 10px;font-family:var(--f-display);font-weight:600;font-size:1.08rem;letter-spacing:.02em;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tab .c{font-family:var(--f-mono);font-size:.74rem;font-weight:500;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:4px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.filters select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;max-width:100%}
.filters .count{color:var(--muted);font-size:.85rem;margin-left:auto}
main{padding-block:6px 80px}
.group{margin-top:18px}
.group h2{font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;gap:8px;align-items:baseline}
.group h2 span{font-family:var(--f-mono);font-size:.75rem;letter-spacing:0;text-transform:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) 190px auto;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);border-left:4px solid var(--rowc,transparent)}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .main{min-width:0;cursor:pointer}
.row .t{font-weight:600;line-height:1.3}
.row .m{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .note{font-size:.84rem;color:var(--fg);opacity:.85;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;width:26px;height:22px;display:inline-flex;align-items:center;justify-content:center;vertical-align:-4px;margin-left:6px;padding:0}
.eye svg{width:16px;height:16px}
.eye:hover{background:var(--accent);color:var(--accent-ink)}
.dest{display:inline-block;font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;border:1px solid var(--line)}
.dest.d-Mantenimiento{background:var(--dest-m-bg);color:var(--dest-m-fg);border-color:transparent}
.dest.d-Finca{background:var(--dest-f-bg);color:var(--dest-f-fg);border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;font-weight:600}
.seg button[aria-pressed="true"].d-Mantenimiento{background:var(--dest-m-bg);color:var(--dest-m-fg);border-color:currentColor}
.seg button[aria-pressed="true"].d-Finca{background:var(--dest-f-bg);color:var(--dest-f-fg);border-color:currentColor}
.regs{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:8px}
.regs li{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:.9rem}
.regs .rh{display:flex;gap:6px;align-items:center;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);margin-bottom:3px}
.regs .rh svg{width:13px;height:13px;flex:none}
.regs .rt{white-space:pre-wrap;overflow-wrap:anywhere}
.yr-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:14px}
table.yr{border-collapse:separate;border-spacing:0;width:100%;min-width:980px;font-size:.86rem}
.yr th,.yr td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:center}
.yr thead th{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-size:.82rem;background:var(--surface);position:sticky;top:0}
.yr thead .ld{font-family:var(--f-mono);font-size:.72rem;letter-spacing:0;text-transform:none;font-weight:500;color:var(--fg)}
.yr .tc{text-align:left;position:sticky;left:0;background:var(--surface);min-width:300px;max-width:360px;padding-left:12px;border-right:1px solid var(--line);z-index:1}
.yr thead .tc{z-index:2}
.yr .tc a{color:var(--fg);font-weight:600;text-decoration:none;cursor:pointer;display:block;line-height:1.25}
.yr .tc a:hover{text-decoration:underline}
.yr .tc small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yr .pc{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);white-space:nowrap;padding-inline:8px}
.yr .gh td{text-align:left;background:var(--surface-2);font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:.84rem;padding:7px 12px}
.yr .gh td:first-child{position:sticky;left:0}
.yr .cur{background:var(--accent-soft)}
.yr td.mc{cursor:pointer;width:52px}
.mk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:.8rem;font-weight:700;line-height:1}
.mk.plan{border:2px solid var(--accent);color:var(--accent)}
.mk.late{background:var(--due-late);color:var(--surface)}
.mk.done{background:var(--s-ejecutado-fg);color:var(--surface)}
.yr-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--muted);margin-top:12px}
.yr-legend span{display:inline-flex;gap:6px;align-items:center}
.yr-legend .mk{width:18px;height:18px;font-size:.66rem}
.ejl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ejl li{display:grid;grid-template-columns:96px 1fr;gap:2px 12px;padding:9px 11px;border:1px solid var(--line);border-left:4px solid var(--s-ejecutado-fg);border-radius:8px;background:var(--surface-2);font-size:.9rem}
.ejl .ed{font-family:var(--f-mono);font-weight:500;grid-row:span 2}
.ejl .ew{color:var(--muted);font-size:.8rem}
.ejl .et{overflow-wrap:anywhere;white-space:pre-wrap}
.nextd{display:flex;gap:6px;flex-wrap:wrap}
.nextd span{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--surface-2)}
.confirm{background:var(--s-espera-bg);color:var(--s-espera-fg);border-radius:8px;padding:10px 12px;font-size:.88rem;display:flex;flex-direction:column;gap:8px;margin-top:8px}
.confirm div{display:flex;gap:8px;flex-wrap:wrap}
.due{font-family:var(--f-mono);font-size:.8rem;line-height:1.3;display:flex;flex-direction:column}
.due .d1{font-weight:500}
.due .d2{color:var(--muted)}
.due.late .d1{color:var(--due-late)} .due.soon .d1{color:var(--due-soon)} .due.ok .d1{color:var(--due-ok)}
.pill{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:5px 26px 5px 11px;font-weight:600;font-size:.82rem;width:100%;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.pill[disabled]{opacity:.9;cursor:default;background-image:none;padding-right:11px}
.st-pendiente{background-color:var(--s-pendiente-bg);color:var(--s-pendiente-fg)}
.st-cola{background-color:var(--s-cola-bg);color:var(--s-cola-fg)}
.st-ejecucion{background-color:var(--s-ejecucion-bg);color:var(--s-ejecucion-fg)}
.st-espera{background-color:var(--s-espera-bg);color:var(--s-espera-fg)}
.st-externa{background-color:var(--s-externa-bg);color:var(--s-externa-fg)}
.st-problemas{background-color:var(--s-problemas-bg);color:var(--s-problemas-fg)}
.st-ejecutado{background-color:var(--s-ejecutado-bg);color:var(--s-ejecutado-fg)}
.st-no_aplica{background-color:var(--s-no_aplica-bg);color:var(--s-no_aplica-fg)}
.pill option{background:var(--surface);color:var(--fg)}
.done{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.done svg{width:16px;height:16px;color:var(--s-ejecutado-fg)}
.done:hover{background:var(--s-ejecutado-bg);border-color:var(--s-ejecutado-fg)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;margin-top:18px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.2rem;margin-bottom:4px}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);vertical-align:1px;margin-left:4px}
.tag.ext{background:var(--s-externa-bg);color:var(--s-externa-fg);border-color:transparent}
.tag.urg{background:var(--s-problemas-bg);color:var(--s-problemas-fg);border-color:transparent}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.42);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:60;box-shadow:var(--shadow);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dh{display:flex;gap:10px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.dh h3{font-family:var(--f-display);font-size:1.45rem;font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
.dh .sub{color:var(--muted);font-size:.88rem;margin-top:4px}
.x{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:36px;height:36px;flex:none;font-size:1.2rem;line-height:1}
.db{overflow-y:auto;padding:16px 18px 30px;display:flex;flex-direction:column;gap:18px}
.sec h4{font-family:var(--f-display);font-weight:600;font-size:.86rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ops{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.info{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem}
.states{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.states button{border:1.5px solid transparent;border-radius:8px;padding:8px 10px;font-weight:600;font-size:.88rem;text-align:left;display:flex;align-items:center;gap:8px}
.states button[aria-pressed="true"]{border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.states button .dot{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.field{display:flex;flex-direction:column;gap:5px;font-size:.88rem}
.field label{font-weight:600}
.field textarea,.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{min-height:76px;resize:vertical}
.rowf{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.rowf .field{flex:1 1 160px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.hist li:first-child{border-top:0}
.hist .when{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);grid-column:1/-1}
.hist .who{color:var(--muted)}
.hist .txt{grid-column:1/-1}
.mini{font-size:.76rem;padding:2px 8px;border-radius:999px;font-weight:600;display:inline-block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 14px;z-index:80;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);width:max-content;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted);padding-block:2px 0}

<script>
(function(){
"use strict";
const CAT = JSON.parse(document.getElementById('catalog').textContent);
const BY_ID = Object.fromEntries(CAT.map(t=>[t.id,t]));
const STATES = [
  ['pendiente','Pendiente'],['ejecucion','En ejecución'],['espera','Esperando material'],
  ['externa','Requiere empresa externa'],['problemas','Con problemas'],['ejecutado','Ejecutado']];
const SLABEL = Object.assign({cola:'Pendiente',no_aplica:'Pendiente'}, Object.fromEntries(STATES));
const normS = s => (!s||s==='cola'||s==='no_aplica') ? 'pendiente' : s;
const DESTS = ['Mantenimiento','Finca'];
const MONTHS = {'mensual':1,'trimestral':3,'semestral':6,'anual':12,'bienal':24,'3 años':36,'5 años':60,'10 años':120};

const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>';
const SCOLOR = s=>`var(--s-${s}-fg)`;
const AREAS = ['Edificio','Forestal','Alimentaria','Laboratorio','Jardinería'];
const PER_LABEL = {'mensual':'Mensual','trimestral':'Trimestral','semestral':'Semestral','anual':'Anual','bienal':'Cada 2 años','3 años':'Cada 3 años','5 años':'Cada 5 años','10 años':'Cada 10 años','tras uso':'Tras cada uso','según inspección':'Según inspección'};
const PRIOS = ['Baja','Media','Alta','Urgente'];
const ACTIVE = new Set(['ejecucion','espera','externa','problemas']);

let db=null, user=null, myId=null, canWrite=false, live=false;
const tstate = {};   // id -> doc
const inc = {};      // id -> incidencia
const names = {};
const ui = {area:'Todas', view:'todo', state:'', q:'', kpi:'', dest:'', year:TODAY_Y()};

function TODAY_Y(){return String(new Date().getFullYear())}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const TODAY = iso(new Date());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const addMonths=(s,n)=>{const [y,m,d]=s.split('-').map(Number);const tgt=new Date(y,m-1+n,1,12);const last=new Date(tgt.getFullYear(),tgt.getMonth()+1,0).getDate();tgt.setDate(Math.min(d,last));return iso(tgt)};
function getEjec(d){
  if(!d) return [];
  if(d.ejec) return d.ejec;
  const out=(d.hist||[]).filter(h=>h.s==='ejecutado'&&h.d).map(h=>({d:h.d,at:h.at,by:h.by,txt:h.n||''}));
  return out.reverse();
}
const fdate=s=>{if(!s)return'';const [y,m,d]=s.slice(0,10).split('-');return `${d}/${m}/${y}`};
const fdt=s=>{if(!s)return'';const d=new Date(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const nm=id=>id?(names[id]||id):'—';
$('#today').textContent = fdate(TODAY);

/* ---------- Estado efectivo de una tarea ---------- */
function eff(t){
  const d = tstate[t.id]||{};
  let status = normS(d.status || t.init);
  const note = d.note!==undefined ? d.note : (t.initNote||'');
  const last = d.lastDone||null;
  let due=null, dueState='';
  if(!t.dias){ dueState = t.per==='tras uso' ? 'uso' : 'demanda'; }
  else if(!last){ dueState='sin'; }
  else { due=MONTHS[t.per]?addMonths(last,MONTHS[t.per]):addDays(last,t.dias); const r=diff(due,TODAY); dueState = r<0?'late':r===0?'late':r<=30?'soon':'ok'; }
  if(status==='ejecutado' && t.dias && due && dueState==='late') status='pendiente';
  const regs = d.regs||[]; const ejec=getEjec(d);
  return {status, note, last, due, dueState, by:d.by, at:d.at, hist:d.hist||[], regs, dest:d.destino||defDest(t.area), hasObs:!!(note||regs.length||ejec.some(x=>x.txt)), ejec};
}
function dueHtml(e,t){
  if(e.dueState==='uso') return `<div class="due"><span class="d1">Tras cada uso</span>${e.last?`<span class="d2">Última: ${fdate(e.last)}</span>`:''}</div>`;
  if(e.dueState==='demanda') return `<div class="due"><span class="d1">${esc(PER_LABEL[t.per]||'A demanda')}</span>${e.last?`<span class="d2">Última: ${fdate(e.last)}</span>`:''}</div>`;
  if(e.dueState==='sin') return `<div class="due late"><span class="d1">Sin registro previo</span><span class="d2">${esc(PER_LABEL[t.per])}</span></div>`;
  const r=diff(e.due,TODAY);
  const txt = r<0?`Vencida hace ${-r} d`: r===0?'Vence hoy': `Vence en ${r} d`;
  return `<div class="due ${e.dueState}"><span class="d1">${txt}</span><span class="d2">${fdate(e.due)} · ${esc(PER_LABEL[t.per])}</span></div>`;
}
const rank=(e)=>{ if(e.status==='problemas')return 0; if(e.status==='ejecucion')return 1; if(e.dueState==='late')return 2; if(e.status==='cola')return 3;
  if(e.status==='espera'||e.status==='externa')return 4; if(e.dueState==='sin')return 5; if(e.dueState==='soon')return 6; return 7; };
function isTodo(t,e){
  if(e.status==='no_aplica') return false;
  if(ACTIVE.has(e.status)) return true;
  if(e.status==='ejecutado') return false;
  if(e.dueState==='uso'||e.dueState==='demanda') return false;
  return true;
}
const thisMonth=s=>s && s.slice(0,7)===TODAY.slice(0,7);

/* ---------- KPIs ---------- */
const KPIS=[
  ['late','Vencidas','var(--due-late)', (t,e)=>e.dueState==='late' && e.status!=='no_aplica'],
  ['sin','Sin registro previo','var(--muted)', (t,e)=>e.dueState==='sin' && !['no_aplica','ejecutado'].includes(e.status)],
  ['soon','Próximos 30 días','var(--due-soon)', (t,e)=>e.dueState==='soon' && e.status!=='no_aplica'],
  ['ejecucion','En ejecución',SCOLOR('ejecucion'),(t,e)=>e.status==='ejecucion'],
  ['problemas','Con problemas',SCOLOR('problemas'),(t,e)=>e.status==='problemas'],
  ['bloq','Esperando / externa',SCOLOR('espera'),(t,e)=>e.status==='espera'||e.status==='externa'],
  ['mes','Hechas este mes',SCOLOR('ejecutado'),(t,e)=>thisMonth(e.last)],
  ['obs','Con observaciones','var(--accent)',(t,e)=>e.hasObs],
];
function renderKpis(){
  const counts=Object.fromEntries(KPIS.map(k=>[k[0],0]));
  for(const t of CAT){ if(ui.area!=='Todas'&&ui.area!=='Incidencias'&&t.area!==ui.area)continue; const e=eff(t); if(ui.dest&&e.dest!==ui.dest)continue; for(const k of KPIS) if(k[3](t,e)) counts[k[0]]++; }
  $('#kpis').innerHTML = KPIS.map(k=>`<button type="button" class="kpi" style="--k:${k[2]}" data-k="${k[0]}" aria-pressed="${ui.kpi===k[0]}"><span class="n">${counts[k[0]]}</span><span class="l">${k[1]}</span></button>`).join('');
}

/* ---------- Pestañas y filtros ---------- */
function renderTabs(){
  const cnt={Todas:0}; AREAS.forEach(a=>cnt[a]=0);
  for(const t of CAT){ const e=eff(t); if(ui.dest&&e.dest!==ui.dest)continue; if(isTodo(t,e)){cnt[t.area]++;cnt.Todas++;} }
  const openInc=Object.values(inc).filter(i=>normS(i.status)!=='ejecutado' && (!ui.dest||(i.destino||defDest(i.area))===ui.dest)).length;
  const tabs=['Todas',...AREAS,'Incidencias'];
  $('#tabs').innerHTML = tabs.map(a=>`<button class="tab" role="tab" type="button" data-a="${a}" aria-selected="${ui.area===a}">${a}<span class="c">${a==='Incidencias'?openInc:cnt[a]}</span></button>`).join('');
}
$('#fState').innerHTML = `<option value="">Todos los estados</option>`+STATES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
{ const y=Number(TODAY_Y()); $('#fYear').innerHTML=[y-1,y,y+1,y+2].map(v=>`<option value="${v}">${v}</option>`).join(''); if(!['todo','usos','all','anual'].includes(ui.view)) ui.view='todo'; if(![y-1,y,y+1,y+2].map(String).includes(String(ui.year))) ui.year=String(y); $('#fYear').value=ui.year; }
$('#fView').value=ui.view; $('#fDest').value=ui.dest||'';

function stateSelect(id,status,kind){
  const opts=STATES.map(s=>`<option value="${s[0]}"${s[0]===status?' selected':''}>${s[1]}</option>`).join('');
  return `<select class="pill st-${status}" data-st="${esc(id)}" data-kind="${kind}" aria-label="Estado" ${canWrite?'':'disabled'}>${opts}</select>`;
}
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function occurrences(t,e,y){
  // devuelve {m: 'plan'|'late'} para el año y
  const out={}; const step=MONTHS[t.per]; if(!step||e.status==='no_aplica') return out;
  const y0=`${y}-01-01`, y1=`${y}-12-31`, curM=TODAY.slice(0,7);
  let d = e.last ? addMonths(e.last,step) : TODAY;
  if(d.slice(0,7) < curM){ // vencida: se arrastra al mes actual
    if(String(y)===TODAY.slice(0,4)) out[Number(curM.slice(5))-1]='late';
    while(d.slice(0,7) <= curM) d=addMonths(d,step);
  } else if(!e.last && String(y)===TODAY.slice(0,4)){ out[Number(curM.slice(5))-1]='late'; d=addMonths(d,step); }
  let guard=0;
  while(d<=y1 && guard++<200){ if(d>=y0){ const m=Number(d.slice(5,7))-1; if(!out[m]) out[m]='plan'; } d=addMonths(d,step); }
  return out;
}
function doneMonths(e,y){ const out={}; for(const x of e.ejec){ if(x.d.slice(0,4)===String(y)){ const m=Number(x.d.slice(5,7))-1; (out[m]=out[m]||[]).push(x); } } return out; }
function filteredTasks(){
  const q=ui.q.trim().toLowerCase(); const rows=[];
  for(const t of CAT){
    if(ui.area!=='Todas' && t.area!==ui.area) continue;
    const e=eff(t);
    if(ui.state && e.status!==ui.state) continue;
    if(ui.dest && e.dest!==ui.dest) continue;
    if(q && !(t.nombre+' '+t.equipo+' '+t.grupo+' '+t.serie+' '+t.area+' '+(e.note||'')).toLowerCase().includes(q)) continue;
    rows.push([t,e]);
  }
  return rows;
}
function yearData(y){
  const out=[];
  for(const [t,e] of filteredTasks()){
    if(!MONTHS[t.per]) continue;
    const occ=occurrences(t,e,y), dn=doneMonths(e,y);
    if(!Object.keys(occ).length && !Object.keys(dn).length) continue;
    out.push({t,e,occ,dn});
  }
  return out;
}
function renderYear(L){
  const y=Number(ui.year); const data=yearData(y);
  const curM = String(y)===TODAY.slice(0,4) ? Number(TODAY.slice(5,7))-1 : -1;
  const load=Array(12).fill(0); data.forEach(r=>{ for(let m=0;m<12;m++) if(r.occ[m]||r.dn[m]) load[m]++; });
  $('#count').textContent=`${data.length} tareas con trabajo en ${y}`;
  if(!data.length){ L.innerHTML=`<div class="empty"><b>Nada previsto en ${y} con estos filtros</b>Las tareas «tras cada uso» y «según inspección» no tienen fecha fija y no salen en el calendario.</div>`; return; }
  const groups=new Map();
  for(const r of data){ const g=(ui.area==='Todas'?r.t.area+' · ':'')+r.t.grupo; if(!groups.has(g))groups.set(g,[]); groups.get(g).push(r); }

  for(const [g,rows] of groups){

      for(let m=0;m<12;m++){

function render(){
  renderKpis(); renderTabs();
  const L=$('#list');
  if(ui.area==='Incidencias'){ $('#fYear').hidden=true; renderInc(L); return; }
  $('#fYear').hidden = ui.view!=='anual';
  if(ui.area==='Jardinería'){
    $('#count').textContent='';
    if(ui.view==='anual'){} 
    L.innerHTML=`<div class="empty"><b>Sin máquinas de jardinería</b>El listado de jardinería que se cargó solo tenía la fila de títulos. Cuando esté completo, se añaden aquí sus tareas.<br>Mientras tanto, cualquier avería se puede registrar como incidencia.</div>`; return;
  }
  if(ui.view==='anual' && !ui.kpi){ renderYear(L); return; }
  const q=ui.q.trim().toLowerCase();
  let rows=[];
  for(const t of CAT){
    if(ui.area!=='Todas' && t.area!==ui.area) continue;
    const e=eff(t);
    if(ui.kpi){ const k=KPIS.find(k=>k[0]===ui.kpi); if(!k[3](t,e)) continue; }
    else if(ui.view==='todo' && !isTodo(t,e)) continue;
    else if(ui.view==='usos' && e.dueState!=='uso') continue;
    if(ui.state && e.status!==ui.state) continue;
    if(ui.dest && e.dest!==ui.dest) continue;
    if(q && !(t.nombre+' '+t.equipo+' '+t.grupo+' '+t.serie+' '+t.area+' '+(e.note||'')+' '+e.regs.map(r=>r.txt).join(' ')).toLowerCase().includes(q)) continue;
    rows.push([t,e]);
  }
  const sortByUrg = ui.view==='todo' || ui.kpi;
  const groups=new Map();
  for(const r of rows){ const g=(ui.area==='Todas'?r[0].area+' · ':'')+r[0].grupo; if(!groups.has(g))groups.set(g,[]); groups.get(g).push(r); }
  if(sortByUrg) for(const g of groups.values()) g.sort((a,b)=>rank(a[1])-rank(b[1]) || String(a[1].due||'0').localeCompare(String(b[1].due||'0')));
  $('#count').textContent = `${rows.length} tarea${rows.length===1?'':'s'}`;
  if(!rows.length){ L.innerHTML=`<div class="empty"><b>Nada pendiente con estos filtros</b>Cambia a «Todas las tareas» para ver también las que están al día.</div>`; return; }
  let html='';
  for(const [g,list] of groups){
    html+=`<section class="group"><h2>${esc(g)} <span>${list.length}</span></h2><div class="list">`;
    for(const [t,e] of list){
      const extTag = /OCA|Empresa|Técnico/.test(t.quien)?`<span class="tag ext">${t.quien.startsWith('Organismo')?'OCA':'Externa'}</span>`:'';
      const rowc = e.status==='problemas'?'var(--s-problemas-fg)': e.dueState==='late'&&e.status!=='no_aplica'?'var(--due-late)':'transparent';
      html+=`<div class="row" style="--rowc:${rowc}">
        <div class="stw">${stateSelect(t.id,e.status,'t')}</div>
        <div class="main" data-open="${t.id}" role="button" tabindex="0"><div class="t">${esc(t.nombre)}${extTag}${e.hasObs?`<button type="button" class="eye" data-obs="${t.id}" title="Ver observaciones" aria-label="Ver observaciones">${EYE}</button>`:''}</div><div class="m">${esc(t.equipo)}${t.serie?' · Nº '+esc(t.serie):''}<span class="dest d-${e.dest}">${e.dest}</span></div></div>
        <div class="dwrap">${dueHtml(e,t)}</div>
        <div class="act"><button type="button" class="done" data-done="${t.id}" ${canWrite?'':'disabled'} title="Registrar como ejecutado hoy">${CHECK}Hecho</button></div>
      </div>`;
    }
    html+='</div></section>';
  }
  L.innerHTML=html;
}

function renderInc(L){
  const q=ui.q.trim().toLowerCase();
  let list=Object.entries(inc).map(([id,i])=>({id,...i,status:normS(i.status),dest:i.destino||defDest(i.area),hasObs:!!(i.note||(i.regs||[]).length)}));
  if(ui.view==='todo') list=list.filter(i=>i.status!=='ejecutado');

  if(q) list=list.filter(i=>(i.titulo+' '+i.equipo+' '+i.desc+' '+(i.note||'')).toLowerCase().includes(q));

  list.sort((a,b)=>pr(b.prioridad)-pr(a.prioridad) || String(b.createdAt).localeCompare(String(a.createdAt)));
  $('#count').textContent=`${list.length} incidencia${list.length===1?'':'s'}`;
  if(!list.length){ L.innerHTML=`<div class="empty"><b>No hay incidencias abiertas</b>Usa el botón «Incidencia» de arriba para avisar de una avería, una rotura o algo que no está en el plan.</div>`; return; }
  L.innerHTML=`<section class="group"><h2>Averías y avisos <span>${list.length}</span></h2><div class="list">`+list.map(i=>{

/* ---------- Escrituras ---------- */
const chains={};
function queue(key,fn){ chains[key]=(chains[key]||Promise.resolve()).then(fn,fn); return chains[key]; }
async function writeDoc(path, body){
  if(!db) return; // modo sin conexión: solo en memoria
  try{ await db.doc(path).set(body); }
  catch(err){
    if(err&&err.code==='invalid_argument'){ canWrite=false; showBanner('No tienes permiso para guardar cambios en esta lista. Pide al propietario acceso como colaborador.'); render(); }
    else if(err&&err.code==='quota_exceeded'){ toast('La base de datos está llena: no se pudo guardar.'); }
    else { toast('No se pudo guardar. Revisa la conexión e inténtalo de nuevo.'); }
    throw err;
  }
}
function updateTask(id, patch, entry){
  if(!canWrite) return;
  const prev = tstate[id] ? structuredClone(tstate[id]) : null;
  const t=BY_ID[id]; const cur = tstate[id] || {status:normS(t.init), note:t.initNote||'', lastDone:null, hist:[], regs:[]};
  const now=new Date().toISOString();
  const next = {...cur, ...patch, by:myId, at:now, hist:[{at:now,by:myId,...entry}, ...(cur.hist||[])].slice(0,40)};
  tstate[id]=next; render(); refreshDrawer();
  queue('t'+id,()=>writeDoc('tareas/'+id,next)).catch(()=>{});
  return prev;
}
function restoreTask(id, prev){
  if(prev){ tstate[id]=prev; queue('t'+id,()=>writeDoc('tareas/'+id,prev)).catch(()=>{}); }
  else { delete tstate[id]; if(db) queue('t'+id,()=>db.doc('tareas/'+id).delete()).catch(()=>{}); }
  render(); refreshDrawer();
}
function updateInc(id, patch, entry){
  if(!canWrite) return;
  const cur=inc[id]||{}; const now=new Date().toISOString();
  const next={...cur,...patch,by:myId,at:now,hist:[{at:now,by:myId,...entry},...(cur.hist||[])].slice(0,40)};
  inc[id]=next; render(); refreshDrawer();
  queue('i'+id,()=>writeDoc('incidencias/'+id,next)).catch(()=>{});
}
function addReg(kind,id,txt,extra){
  if(!canWrite||!txt) return;
  const now=new Date().toISOString(); const reg={at:now,by:myId,txt,...(extra||{})};
  if(kind==='t'){ const cur=tstate[id]||{}; updateTask(id,{regs:[...(cur.regs||[]),reg].slice(-100)},{n:'Registro grabado: '+txt}); }
  else { const cur=inc[id]||{}; updateInc(id,{regs:[...(cur.regs||[]),reg].slice(-100)},{n:'Registro grabado: '+txt}); }
}
function markDone(id, date, note){
  const e=eff(BY_ID[id]);
  if(!canWrite) return;
  const dd=date||TODAY; const cur=tstate[id]||{};
  const ej=[...getEjec(cur),{d:dd,at:new Date().toISOString(),by:myId,txt:note||''}].sort((a,b)=>a.d.localeCompare(b.d)).slice(-300);
  const last=(e.last && e.last>dd)?e.last:dd;
  const patch={status:(e.last && e.last>dd)?e.status:'ejecutado', lastDone:last, ejec:ej};
  const prev=updateTask(id, patch, {s:'ejecutado', d:dd, n:note||''});
  if(note) toast(`Ejecución grabada: ${BY_ID[id].nombre}`);
  else toast(`Registrado: ${BY_ID[id].nombre}`, ()=>restoreTask(id,prev));
}

function refreshDrawer(){
  if(!open||open.kind==='new') return;
  if(open.kind==='t'){
    const t=BY_ID[open.id]; const e=eff(t);
    const sd=$('#dDue'); if(sd) sd.innerHTML=`<h4>Plazo</h4>${dueHtml(e,t)}${e.last?`<div style="font-size:.86rem;color:var(--muted);margin-top:4px">Última realización: ${fdate(e.last)}</div>`:''}`;

    const rg=$('#dRegs'); if(rg) rg.innerHTML=regsHtml(e.regs);
    const ej=$('#dEjec'); if(ej) ej.innerHTML = e.ejec.length ? `<ul class="ejl">${[...e.ejec].reverse().map(x=>`<li><span class="ed">${fdate(x.d)}</span><span class="et">${x.txt?esc(x.txt):'<span style="color:var(--muted)">Sin descripción</span>'}</span><span class="ew">${esc(nm(x.by))} · anotado ${fdt(x.at)}</span></li>`).join('')}</ul>` : '<p style="color:var(--muted);margin:0;font-size:.88rem">Todavía no se ha registrado ninguna. Usa «Registrar ejecución» para apuntarla.</p>';
    const nx=$('#dNext'); if(nx){ const st=MONTHS[t.per]; if(!st) nx.innerHTML=`<p style="margin:0;font-size:.88rem;color:var(--muted)">${esc(PER_LABEL[t.per])}: sin fecha fija.</p>`;
      else { let d=e.last?addMonths(e.last,st):TODAY; const ds=[]; for(let i=0;i<5;i++){ ds.push(d); d=addMonths(d,st); }
        nx.innerHTML=`<div class="nextd">${ds.map((x,i)=>`<span${i===0&&x<=TODAY?' style="color:var(--due-late);border-color:var(--due-late)"':''}>${fdate(x)}</span>`).join('')}</div><p style="margin:6px 0 0;font-size:.8rem;color:var(--muted)">${e.last?'Calculadas desde la última ejecución ('+fdate(e.last)+').':'Sin ejecución previa: la primera toca ya.'}</p>`; } }

      Periodicidad:PER_LABEL[t.per], 'Cada (días)':t.dias??'', Obligatorio:t.oblig, Normativa:t.norma, 'Quién lo hace':t.quien, 'Aplica si':t.aplica,
      Estado:SLABEL[e.status], 'Situación':sit, 'Última realización':e.last||'', 'Próxima fecha':e.due||'', Observaciones:e.note||'',
      'Registro de trabajos':e.regs.map(r=>`[${fdt(r.at)} · ${nm(r.by)}] ${r.txt}`).join('\n'),
      'Actualizado por':e.by?nm(e.by):'', Actualizado:e.at||''}; });
}
function incRows(){
  return Object.entries(inc).map(([id,i])=>({Título:i.titulo,'Código':id,'Área':i.area||'','Asignado a':i.destino||defDest(i.area),Prioridad:i.prioridad||'','Equipo o ubicación':i.equipo||'',
    'Descripción':i.desc||'',Estado:SLABEL[normS(i.status)],Observaciones:i.note||'','Registro de trabajos':(i.regs||[]).map(r=>`[${fdt(r.at)} · ${nm(r.by)}] ${r.txt}`).join('\n'),'Avisada':i.createdAt||'','Avisada por':nm(i.createdBy),'Actualizado':i.at||'','Actualizado por':i.by?nm(i.by):''}));

function ejecRows(){
  const out=[];
  for(const t of CAT){ const e=eff(t); for(const x of e.ejec) out.push({Título:t.nombre,'Código':t.id,'Área':t.area,'Asignado a':e.dest,Equipo:t.equipo,'Fecha realización':x.d,'Descripción de la tarea':x.txt||'','Realizada por':nm(x.by),'Anotado':x.at||''}); }
  return out.sort((a,b)=>String(b['Fecha realización']).localeCompare(String(a['Fecha realización'])));

function planRows(y){
  return yearData(y).map(r=>{ const o={Título:r.t.nombre,'Código':r.t.id,'Área':r.t.area,'Asignado a':r.e.dest,Equipo:r.t.equipo,Periodicidad:PER_LABEL[r.t.per]};
    MES.forEach((m,i)=>{ o[m]= r.dn[i] ? 'Hecha '+r.dn[i].map(x=>fdate(x.d).slice(0,5)).join(', ') : r.occ[i]==='late' ? 'Vencida' : r.occ[i]==='plan' ? 'Prevista' : ''; });

function histRows(){
  const out=[];
  for(const t of CAT){ const d=tstate[t.id]; if(!d) continue; for(const r of (d.regs||[])) out.push({Título:t.nombre,'Código':t.id,'Tipo':'Registro (no editable)',Equipo:t.equipo,'Fecha':r.at,'Estado':'Registro','Fecha realización':r.d||'','Observación':r.txt,Usuario:nm(r.by)}); if(!d.hist) continue; for(const h of d.hist) out.push({Título:t.nombre,'Código':t.id,'Tipo':'Tarea',Equipo:t.equipo,'Fecha':h.at,'Estado':h.s?SLABEL[h.s]:'Observación','Fecha realización':h.d||'','Observación':h.n||'',Usuario:nm(h.by)}); }
  for(const [id,i] of Object.entries(inc)) for(const r of (i.regs||[])) out.push({Título:i.titulo,'Código':id,'Tipo':'Registro (no editable)',Equipo:i.equipo||'','Fecha':r.at,'Estado':'Registro','Fecha realización':'','Observación':r.txt,Usuario:nm(r.by)});
  for(const [id,i] of Object.entries(inc)) for(const h of (i.hist||[])) out.push({Título:i.titulo,'Código':id,'Tipo':'Incidencia',Equipo:i.equipo||'','Fecha':h.at,'Estado':h.s?SLABEL[h.s]:'Observación','Fecha realización':h.d||'','Observación':h.n||'',Usuario:nm(h.by)});
  return out.sort((a,b)=>String(b.Fecha).localeCompare(String(a.Fecha)));
}
const DATECOLS=new Set(['Última realización','Próxima fecha','Fecha realización']);
const DTCOLS=new Set(['Actualizado','Avisada','Fecha','Anotado']);
function csv(rows){
  if(!rows.length) return '';
  const cols=Object.keys(rows[0]);
  const cell=(c,v)=>{ if(DTCOLS.has(c)&&v){ const d=new Date(v); v=`${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; } return '"'+String(v??'').replace(/"/g,'""')+'"'; };
  return '﻿'+[cols.map(c=>cell('',c)).join(','), ...rows.map(r=>cols.map(c=>cell(c,r[c])).join(','))].join('\r\n');
}
function loadScript(src){ return new Promise((res,rej)=>{ if(window.ExcelJS) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function save(filename,data){
  try{
    const type = filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    const blob = new Blob([data],{type});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
    toast('Archivo listo');
  }catch(e){ toast('No se pudo descargar el archivo.'); }
}
async function doExport(kind){
  await refreshNames();

  toast('Preparando el Excel…');
  try{ await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'); }
  catch(e){ toast('No se pudo cargar el generador de Excel. Usa el CSV.'); return; }
  const wb=new ExcelJS.Workbook(); wb.creator='Mantenimiento CIFP La Granja'; wb.created=new Date();
  const toDate=(c,v)=>{ if(!v) return null; if(DATECOLS.has(c)){const [y,m,d]=v.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
    if(DTCOLS.has(c)){ const d=new Date(v); return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),d.getHours(),d.getMinutes())); } return v; };
  const addSheet=(name,rows,widths)=>{
    if(!rows.length) return;
    const ws=wb.addWorksheet(name,{views:[{state:'frozen',ySplit:1}]});
    const cols=Object.keys(rows[0]);
    ws.addTable({name, ref:'A1', headerRow:true, style:{theme:'TableStyleMedium7',showRowStripes:true},
      columns:cols.map(c=>({name:c,filterButton:true})), rows:rows.map(r=>cols.map(c=>{const v=toDate(c,r[c]); return v===''?null:v;}))});
    cols.forEach((c,i)=>{ const col=ws.getColumn(i+1); col.width=widths[c]||16;
      if(DATECOLS.has(c)) col.numFmt='dd/mm/yyyy'; if(DTCOLS.has(c)) col.numFmt='dd/mm/yyyy hh:mm';
      if(['Operaciones','Observaciones','Descripción','Normativa','Observación','Aplica si','Registro de trabajos'].includes(c)) col.alignment={wrapText:true,vertical:'top'}; });
  };
  addSheet('Tareas',taskRows(),{Título:46,'Código':10,Grupo:24,Equipo:38,Operaciones:50,Normativa:34,'Quién lo hace':24,'Aplica si':30,Estado:20,'Situación':18,'Última realización':14,'Próxima fecha':14,Observaciones:40,'Registro de trabajos':50,'Asignado a':15,'Actualizado':17});
  addSheet('Incidencias',incRows(),{Título:40,'Equipo o ubicación':30,'Descripción':50,Observaciones:40,'Avisada':17,'Actualizado':17});
  const yNow=Number(TODAY_Y());
  addSheet('Ejecuciones',ejecRows(),{Título:44,Equipo:36,'Descripción de la tarea':50,'Realizada por':22,'Anotado':17,'Fecha realización':14});
  addSheet('Plan'+yNow,planRows(yNow),{Título:44,Equipo:36,Periodicidad:14});
  addSheet('Plan'+(yNow+1),planRows(yNow+1),{Título:44,Equipo:36,Periodicidad:14});
  addSheet('Historial',histRows(),{Título:44,Equipo:36,'Fecha':17,'Observación':44,Estado:20});
  const buf=await wb.xlsx.writeBuffer();
  await save(`mantenimiento_${stamp}.xlsx`, new Blob([buf]));
}

/* ---------- Conexión con la hoja de Google (Apps Script) ---------- */
const API = (window.MANT_CONFIG && window.MANT_CONFIG.apiUrl || '').trim();
const POLL_MS = 15000;

function makeDb(url){
  const listeners = {};          // col -> [{cb, err}]
  const known = {};              // col -> {id: json}
  const pending = {};            // 'col/id' -> nº de escrituras en curso
  const doneAt = {};             // 'col/id' -> instante en que terminó la última escritura
  let timer=null, busy=false;

  async function call(body){
    const r = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body), redirect:'follow'});
    if(!r.ok) throw Object.assign(new Error('HTTP '+r.status),{code:'http'});
    const j = await r.json();
    if(!j.ok) throw Object.assign(new Error(j.error||'Error'),{code:j.code||'server'});
    return j;
  }
  async function poll(){
    if(busy) return; busy=true;
    const started = Date.now();
    try{
      const j = await call({action:'list'});
      for(const col of Object.keys(listeners)){
        const incoming = j.data[col] || {};
        const prev = known[col] || (known[col]={});
        const changes=[];
        for(const [id,data] of Object.entries(incoming)){
          const k=col+'/'+id;
          if(pending[k] || (doneAt[k] && doneAt[k] > started)) continue;
          const s=JSON.stringify(data);
          if(prev[id]!==s){ prev[id]=s; changes.push({type:'modified', doc:{id, data:()=>data}}); }
        }
        for(const id of Object.keys(prev)){
          const k=col+'/'+id;
          if(!(id in incoming) && !pending[k] && !(doneAt[k] && doneAt[k] > started)){ delete prev[id]; changes.push({type:'removed', doc:{id, data:()=>null}}); }
        }
        if(changes.length) listeners[col].forEach(l=>{ try{ l.cb({docChanges:()=>changes}); }catch(e){ console.error(e); } });
      }
      setConn(true);
    }catch(err){
      setConn(false);
      for(const col of Object.keys(listeners)) listeners[col].forEach(l=>l.err&&l.err(err));
    }finally{ busy=false; }
  }
  function start(){ if(!timer){ poll(); timer=setInterval(()=>{ if(!document.hidden) poll(); }, POLL_MS); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) poll(); }); } }
  async function write(col,id,data){
    const k=col+'/'+id; pending[k]=(pending[k]||0)+1;
    try{
      await call(data===null ? {action:'delete', col, id} : {action:'set', col, id, data, by:myId||''});
      (known[col]||(known[col]={}));
      if(data===null) delete known[col][id]; else known[col][id]=JSON.stringify(data);
    }finally{ pending[k]--; if(!pending[k]) delete pending[k]; doneAt[k]=Date.now(); }
  }
  return {
    collection(col){ return { onSnapshot(cb, err){ (listeners[col]||(listeners[col]=[])).push({cb,err}); start(); } }; },
    doc(path){ const [col,id]=path.split('/'); return { set:(data)=>write(col,id,data), delete:()=>write(col,id,null) }; },
    refresh: poll,
  };
}

let connOk=null;
function setConn(ok){
  if(ok===connOk) return; connOk=ok;
  if(ok){ const b=document.querySelector('.banner'); if(b && /conexión/i.test(b.textContent)) b.hidden=true; }
  else showBanner('Sin conexión con la hoja de datos. Se reintentará automáticamente.');
}

render();
(function(){
  showWho();
  if(!API){
    showBanner('Falta configurar la conexión con la hoja de datos (config.js). Los cambios no se guardarán.');
    canWrite=true; render(); return;
  }
  db = makeDb(API);
  canWrite = true; render();
  db.collection('tareas').onSnapshot(snap=>{
    for(const ch of snap.docChanges()){ if(ch.type==='removed') delete tstate[ch.doc.id]; else tstate[ch.doc.id]=structuredClone(ch.doc.data()); }
    live=true; render(); refreshDrawer();
  }, err=>{});
  db.collection('incidencias').onSnapshot(snap=>{
    for(const ch of snap.docChanges()){ if(ch.type==='removed') delete inc[ch.doc.id]; else inc[ch.doc.id]=structuredClone(ch.doc.data()); }
    render(); if(open&&open.kind==='i') refreshDrawer();
  }, err=>{});
})();
})();
